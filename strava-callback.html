<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Conectando Strava | Corra Por Você
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #03182b;

            color: white;

            font-family:
                Arial,
                sans-serif;

        }

        .card {

            width: min(
                420px,
                calc(100% - 32px)
            );

            padding: 40px 30px;

            border-radius: 20px;

            background: #08233b;

            border:
                1px solid
                rgba(255,255,255,.12);

            text-align: center;

        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #9fb5c9;
            line-height: 1.6;
        }

        .status {

            margin-top: 24px;

            color: #fc6b03;

            font-weight: bold;

        }

    </style>

</head>

<body>

    <main class="card">

        <h1>
            Conectando Strava
        </h1>

        <p>
            Estamos concluindo a conexão
            da sua conta.
        </p>

        <div
            id="status"
            class="status"
        >
            Aguarde...
        </div>

    </main>


    <script>

        const statusElement =
            document.getElementById("status");


        async function processCallback() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            /*
             * Usuário recusou autorização.
             */

            const error =
                params.get("error");


            if (error) {

                statusElement.textContent =
                    "Conexão com o Strava cancelada.";

                return;

            }


            /*
             * Dados enviados pelo Strava.
             */

            const code =
                params.get("code");

            const scope =
                params.get("scope");

            const state =
                params.get("state");


            if (!code) {

                statusElement.textContent =
                    "Código de autorização não encontrado.";

                return;

            }


            /*
             * Verifica se o atleta autorizou
             * acesso às atividades.
             */

            if (
                !scope ||
                !scope.includes(
                    "activity:read"
                )
            ) {

                statusElement.textContent =
                    "É necessário permitir acesso às atividades.";

                return;

            }


            try {

                /*
                 * Envia o código para nossa
                 * Edge Function.
                 */

                const response =
                    await fetch(
                        "https://dkvmnznkhoprdpqpcjlu.supabase.co/functions/v1/super-worker",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    code: code,

                                    state: state

                                })

                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.error ||
                        "Falha ao conectar Strava."
                    );

                }


                statusElement.textContent =
                    "✓ Strava conectado com sucesso!";


                /*
                 * Volta para a área
                 * do participante.
                 */

                setTimeout(
                    () => {

                        window.location.href =
                            "participante.html";

                    },
                    1500
                );


            } catch (error) {

                console.error(
                    "Erro callback Strava:",
                    error
                );


                statusElement.textContent =
                    "Não foi possível concluir a conexão.";

            }

        }


        processCallback();

    </script>

</body>

</html>
